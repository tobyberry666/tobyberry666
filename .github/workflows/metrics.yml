name: GitHub Metrics

# 每天 UTC 23:17（≈ 北京 07:17）检查；每 10 天随机选 4–5 天刷新。
# 手动触发不受随机频率限制。
# 注意：不要加 push 触发，否则 action 自己提交会无限触发。
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      METRICS_USER: tobyberry666
    steps:
      - name: Decide whether today is a refresh day
        id: cadence
        shell: python
        run: |
          import hashlib
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          day_number = (today - date(2026, 1, 1)).days
          block, position = divmod(day_number, 10)
          seed = f"{os.environ['GITHUB_REPOSITORY']}:{block}"
          digest = hashlib.sha256(seed.encode()).digest()
          refresh_count = 4 + digest[0] % 2
          ranked_days = sorted(
              range(10),
              key=lambda day: hashlib.sha256(f"{seed}:{day}".encode()).digest(),
          )
          refresh_days = sorted(ranked_days[:refresh_count])
          manual_run = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          should_run = manual_run or position in refresh_days

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_run={str(should_run).lower()}\n")

          print(
              f"Beijing date {today}: block {block}, day {position + 1}/10, "
              f"refresh days {[day + 1 for day in refresh_days]}, run={should_run}"
          )
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.should_run == 'true'
      - name: Generate flat SVG (no foreignObject, camo-safe)
        if: steps.cadence.outputs.should_run == 'true'
        run: python3 generate_metrics.py
      - name: Commit & push
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh github-metrics.svg"
            git push
          fi
