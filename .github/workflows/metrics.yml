name: GitHub Metrics

# 每天 UTC 23:17（≈ 北京 07:17）自动刷新；也可在 Actions 页面手动触发。
# 注意：不要加 push 触发，否则 action 自己提交会无限触发。
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      METRICS_USER: tobyberry666
    steps:
      - uses: actions/checkout@v4
      - name: Generate flat SVG (no foreignObject, camo-safe)
        run: python3 generate_metrics.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh github-metrics.svg"
            git push
          fi
